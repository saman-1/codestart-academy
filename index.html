
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Landing Page</title>
</head>
<body>
    <!-- Header Section -->
    <header id="home">

        <!-- Navbar Section -->
        <nav class="navbar">

            <!-- Logo Section -->
            <div class="logo">
                <img src="./images/logo.png" alt="لوگوی وبسایت آموزشی کد استارت آکادمی" class="logo-image">
            </div>

            <!-- Menu List -->
            <ul class="navbar-list">
                <li class="list-item navbar-item">
                    <a href="#home" class="link-item">
                        صفحه اصلی
                    </a>
                </li>
                <li class="list-item navbar-item">
                    <a href="#features" class="link-item">
                        خدمات
                    </a>
                </li>
                <li class="list-item navbar-item">
                    <a href="#courses" class="link-item">
                        دوره ها
                    </a>
                </li>
                <li class="list-item navbar-item">
                    <a href="#about-us" class="link-item">
                        درباره ما
                    </a>
                </li>
                <li class="list-item navbar-item">
                    <a href="#contact-us" class="link-item">
                        تماس با ما
                    </a>
                </li>
            </ul>

            <!-- Signin & signup Section -->
            <div class="signin-signup">
                <button class="btn signup-btn">ثبت نام</button>
                <button class="btn signin-btn">ورود</button>
            </div>
        </nav>

        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">
                    مسیر برنامه‌نویسی تو از اینجا شروع می‌شود
                </h1>

                <p class="hero-description">
                    با دوره‌های پروژه‌محور، مهارت‌های برنامه‌نویسی را
                    قدم‌به‌قدم یاد بگیر.
                </p>

                <a href="#courses" class="btn hero-btn">
                    مشاهده دوره‌ها
                </a>
            </div>

            <div class="hero-code">
                <div class="code-header">
                    <div class="code-window-controls">
                        <span class="code-dot"></span>
                        <span class="code-dot"></span>
                        <span class="code-dot"></span>
                    </div>

                    <span class="code-filename">index.html</span>
                </div>

                <div class="code-editor">
                    <div class="code-line">
                        <span class="line-number">1</span>
                        <code><span class="code-tag">&lt;h1&gt;</span><span class="code-text">Hello, World!</span><span class="code-tag">&lt;/h1&gt;</span></code>
                    </div>

                    <div class="code-line">
                        <span class="line-number">2</span>
                        <code><span class="code-tag">&lt;p&gt;</span><span class="code-text">Start coding today.</span><span class="code-tag">&lt;/p&gt;</span></code>
                    </div>

                    <div class="code-line">
                        <span class="line-number">3</span>
                        <code><span class="code-tag">&lt;button&gt;</span><span class="code-text">Let's learn! </span><span class="code-tag">&lt;/button&gt;</span></code>
                    </div>
                </div>
            </div>
        </section>

    </header>

    <!-- Features Cection -->
    <section class="features" id="features">

        <article class="card feature-card"></article>
        <article class="card feature-card"></article>
        <article class="card feature-card"></article>

    </section>

    <!-- Courses Section -->
    <section class="courses" id="courses">

        <article class="card course-card"></article>
        <article class="card course-card"></article>
        <article class="card course-card"></article>

    </section>

    <!-- Call To Action Section -->
    <section class="cta"></section>

    <!-- About Us Section -->
    <section class="about-us" is="about-us"></section>

    <!-- Contact Us Section -->
     <section class="contact-us" id="contact-us"></section>

    <!-- Footer Section -->
    <footer class="footer"></footer>

</body>
</html>
