
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت‌نام | CodeStart Academy</title>

    <link rel="stylesheet" href="./css/fontiran.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main id="register-page">

        <section class="auth-container">

            <div class="auth-card">

                <!-- Logo -->
                <a href="./index.html" class="auth-logo">
                    <img
                        src="./images/logo-light.png"
                        alt="CodeStart Academy"
                        id="auth-logo"
                    >
                </a>

                <!-- Heading -->
                <div class="auth-header">
                    <h1>به خانواده ما خوش اومدی!</h1>
                    <p>برای ساخت حساب کاربری، اطلاعاتت رو وارد کن.</p>
                </div>

                <!-- Register Form -->
                <form class="auth-form" id="register-form">

                    <div class="form-group">
                        <label for="register-name">نام و نام خانوادگی</label>
                        <input
                            type="text"
                            id="register-name"
                            name="name"
                            placeholder="نام و نام خانوادگی خود را وارد کنید"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="register-email">ایمیل</label>
                        <input
                            type="email"
                            id="register-email"
                            name="email"
                            placeholder="example@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="register-password">رمز عبور</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="register-password"
                                name="password"
                                placeholder="یک رمز عبور انتخاب کنید"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                id="toggle-register-password"
                                aria-label="نمایش رمز عبور"
                            >
                                <!-- آیکون چشم -->
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="register-confirm-password">تکرار رمز عبور</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="register-confirm-password"
                                name="confirm-password"
                                placeholder="رمز عبور را دوباره وارد کنید"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                id="toggle-confirm-password"
                                aria-label="نمایش رمز عبور"
                            >
                                <!-- آیکون چشم -->
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="auth-submit-btn">
                        ایجاد حساب کاربری
                    </button>

                    <div class="auth-footer">
                        <p>
                            قبلاً حساب کاربری ساختی؟
                            <a href="./login.html">وارد شو</a>
                        </p>
                    </div>

                </form>

            </div>

        </section>

    </main>

    <script src="./js/script.js"></script>

</body>

</html>
