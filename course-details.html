
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta

            </div>

            <!-- Menu List -->
            <ul class="navbar-list" id="navbar-list">
                <li class="list-item navbar-item home-item">
                    <a href="./index.html#home" class="link-item">
                        صفحه اصلی
                    </a>
                </li>
                <li class="list-item navbar-item features-item">
                    <a href="./index.html#features" class="link-item">

                    <a href="./all_courses.html" class="link-item">

                </li>
                <li class="list-item navbar-item favorites-item">
                    <a href="./favorites.html" class="link-item">

                <li class="list-item navbar-item about-us-item">

                </li>
                <li class="list-item navbar-item contact-us-item">
                    <a href="./index.html#contact-us" class="link-item">

                    </a>
                </li>

                <!-- Mobile Auth Buttons -->
                <li class="navbar-item mobile-auth">
                    <div class="signin-signup">
                        <button
                            class="btn signup-btn"
                            id="mobile-signup-btn"
                            type="button"
                        >
                            ثبت نام
                        </button>

                        <button
                            class="btn signin-btn"
                            id="mobile-signin-btn"
                            type="button"

                    </div>
                </li>

            <div class="desktop-actions">

                <button
                    type="button"
                    class="theme-toggle search-toggle"
                    id="search-toggle"
                    aria-label="باز کردن جست‌وجو"
                    aria-expanded="false"
                >
                    🔍
                </button>

                <!-- Theme Toggle Button -->
                <button
                    class="theme-toggle"
                    id="theme-toggle"
                    type="button"
                    aria-label="فعال‌کردن حالت تاریک"
                    title="تغییر تم"

                    <span id="theme-icon" aria-hidden="true">🌙</span>

                <!-- Desktop Auth Buttons -->
                <div class="signin-signup desktop-auth">

                    <button
                        class="btn signup-btn"
                        id="desktop-signup-btn"
                        type="button"

                    <button

                        type="button"
